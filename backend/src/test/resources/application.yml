spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/mock-jwks

foodprint:
  ai:
    gemini:
      api-key: test-key
      model: gemini-2.5-flash
    usda:
      api-key: test-key

supabase:
  url: http://localhost/mock-supabase
  service-role-key: mock-key

